# detect-secrets 排除模式（正则表达式）
#
# 注意：detect-secrets 默认不会读取此文件。如果您希望应用这些规则，
# 请将它们添加到您的扫描命令中（例如转换为 --exclude-files
# / --exclude-lines）或添加到基线的 filters_used 中。

[exclude-files]
# pnpm 锁定文件包含大量高熵的包完整性 blob。
pattern = (^|/)pnpm-lock\.yaml$
# 生成的输出和供应商资产。
pattern = (^|/)(dist|vendor)/
# 包含允许列表模式的本地配置文件。
pattern = (^|/)\.detect-secrets\.cfg$

[exclude-lines]
# Fastlane 检查私钥标记；不是真正的密钥。
pattern = key_content\.include\?\("BEGIN PRIVATE KEY"\)
# Anthropic 认证模式的 UI 标签字符串。
pattern = case \.apiKeyEnv: "API key \(env var\)"
# CodingKeys 映射使用 apiKey 字面量。
pattern = case apikey = "apiKey"
# 引用密码字段的架构标签（不是实际的密钥）。
pattern = "gateway\.remote\.password"
pattern = "gateway\.auth\.password"
# talk API 密钥的架构标签（仅标签文本）。
pattern = "talk\.apiKey"
# 检查 typeof 不是我们关心的内容。
pattern = === "string"
# 特定的可选链密码检查，与上一行不匹配。
pattern = typeof remote\?\.password === "string"
